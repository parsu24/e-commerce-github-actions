#goal: build dummy ci/cd pipeline

name: CICD Demo

on: 
 push:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        uses: actions/checkout@v4
  build: 
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Build the code with docker
        run: echo "code built"
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: test the application
        run: echo "test passed"
  deploy:
    needs: [code,build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app on server
        run: echo "Application deployed"
  



