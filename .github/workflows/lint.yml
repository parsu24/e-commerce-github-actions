#Goal : to check if the python code is syntactically correct

name: Code Lint

on: 
    push:
jobs:
    code-linter:
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with: 
                 python-version: '3.13' 
                 
            - name: Install dependencies
              run: pip install -r requirements.txt


            - name: code lint check
              run: ruff check .
