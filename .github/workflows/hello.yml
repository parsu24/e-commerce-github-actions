#Goal : to say the hello and tell the title /name of the repository
# start with naming your workflow
name: Hello
on: 
 workflow_dispatch: 
jobs:
  greet:
   runs-on: ubuntu-latest
   steps:
     - name: Say hello
       run: echo "Hello Dosto"
  repo-name:
    needs: greet
    runs-on: ubuntu-latest
    steps:
      - name: Show the repository name
        run: echo "Repository name is ${{ github.event.repository.name }}"
    
  
  


 
     
     
     


  
  
    


