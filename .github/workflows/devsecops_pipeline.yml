# Goal: is to call the workflow in the order to implement shift left

name: DevSecOps

on:
  push:

jobs:
  
  #Secret scan
  secret-scan:
      uses: ./.github/workflows/secrets-scanning.yml
      secrets: inherit

  # Code
  code:
      needs: secret-scan
      uses: ./.github/workflows/lint_and_test.yml
  # SAST
  sast:
     needs: code
     uses: ./.github/workflows/sonar_scan.yml
     secrets: inherit
  
  #Dependency scan

  dependency-scan:
      needs: sast
      uses: ./.github/workflows/dependency_scan.yml

  #Build and Scan
  build_and_scan:
      secrets: inherit
      needs: dependency-scan
      uses: ./.github/workflows/trivy_scan.yml
  
  # push the image
  docker-push:
        secrets: inherit
        needs: build_and_scan
        uses: ./.github/workflows/docker_push.yml
         
  # Deploy
  deploy: 
      secrets: inherit
      needs: [docker-push]
      uses: ./.github/workflows/cd.yml

# DAST
  dast: 
      secrets: inherit
      needs: [deploy]
      uses: ./.github/workflows/dast.yml


      

