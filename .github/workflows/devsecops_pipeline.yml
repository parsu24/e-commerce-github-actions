# Goal: is to call the workflow in the order to implement shift left

name: DevSecOps

on:
  push:

jobs:
  
  #Secret scan
  secret-scan:
      uses: ./.github/workflows/secrets-scanning.yml
      secrets: inherit

  # Code
  code:
      needs: secret-scan
      uses: ./.github/workflows/lint_and_test.yml
  # SAST
  sast:
     needs: code
     uses: ./.github/workflows/sonar_scan.yml
     secrets: inherit
  
  #Dependency scan

  dependency-scan:
      needs: sast
      uses: ./.github/workflows/dependency_scan.yml






