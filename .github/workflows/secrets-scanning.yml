#Goal : scan the code for tokens, secrets, API keys, or any leaked password
# so that if found, we can quickly rotate the exposed tokens/key/etc

#name of the workflow
name: Secrets Scan

#Reusable workflow can be called again and again wherever needed

on: 
  workflow_call:

jobs:
  secret-scan:
     runs-on: ubuntu-latest
     steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
           fetch-depth: 0  # from the very first commit pull all the code

      - name: Scan for Leaks
        uses: dortort/betterleaks-action@v0.1.
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # By default present in the workflow. we don't have to add it.
        with: 
          config: .github/.gitleaks.toml


      