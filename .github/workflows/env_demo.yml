
name: Show Env variables

on:
  workflow_dispatch:
    inputs:
      envirinment: 
        description: select the environment you want
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  NAME: prashant

jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:  
      - name: Show plain text environment
        run: echo "My name is ${{env.NAME}}"
      - name: Show Secrets 
        run: echo "one fun secret is ${{secrets.PARSU_SECRET}}"
      - name: Show env variable
        run: echo "My docker user name is  ${{vars.DOCKERHUB_USERNAME}}"
      - name: Show the input env
        run: echo "Selected environment is ${{inputs.envirinment}}"


      
     
    

    

